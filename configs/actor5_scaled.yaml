# Pipeline mode.
# `mvsp` = multiview single person, current supported path.
# `mvmp` = multiview multi person, reserved but not implemented yet.
mode:
  type: mvsp

# Camera calibration in the compact single-YAML format.
cameras:
  path: /home/ymj/code/python/LightMoCap/data/actor5/cameras.yaml

# Input image root and default output root.
data:
  images: /mnt/g/code/datasets/zju4dv/actor5/other-formats/wu-4dgs/output_renamed
  output: /home/ymj/code/python/LightMoCap/output-test-actor5

# Body model selection.
model:
  model_path: /home/ymj/code/python/EasyMocap/models/smplx
  gender: female
  ext: npz
  device: cuda

# 2D detector frontend.
detector:
  type: rtmlib
  solution: wholebody
  mode: performance
  device: cuda
  backend: onnxruntime

# Rendering defaults.
render:
  render_device: gpu
  mesh_color: [83,83,100]
  alpha: 1.0
  edge_color: null
  metallic_factor: 0.05
  roughness_factor: 0.65

# SMPL-X fitting schedule.
# `loss_weights` is written out explicitly here for readability and easy tuning.
fitting:
  maxiters: 15
  shape_maxiters: 5
  lbfgs_inner_max_iter: 8
  enable_k2d_refine: true
  k3d_robust_sigma: 0.05
  stages:
    - name: shape
    - name: torso
      maxiters: 30
      shoulder_weight: 5.0
      hip_weight: 5.0
      initialize: true
    - name: pose
      maxiters: 15
    - name: pose2d
      maxiters: 15
  loss_weights:
    k2d: 0.0001
    k3d: 1.0
    k3d_hand: 5.0
    k3d_face: 2.0
    joint_prior: 0.1
    reg_poses: 0.001
    reg_poses_zero: 0.01
    reg_hand: 0.0001
    reg_head: 0.01
    reg_expr: 0.01
    reg_shapes: 0.005
    smooth_body: 0.5
    smooth_poses: 0.1
    smooth_Rh: 0.1
    smooth_hand: 0.001
    smooth_head: 0.0
    init_poses: 0.01
    init_shapes: 0.01
    s3d: 1.0
