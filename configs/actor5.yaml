# Pipeline mode.
# `mvsp` = multiview single person, current supported path.
# `mvmp` = multiview multi person, reserved but not implemented yet.
mode:
  type: mvsp

# Camera calibration in the compact single-YAML format.
cameras:
  path: /home/ymj/code/python/EasyMocap/actor5/cameras.yaml

# Input image root and default output root.
data:
  images: /home/ymj/code/python/EasyMocap/actor5
  output: /home/ymj/code/python/EasyMocap/lightmocap/outputs/actor5

# Body model selection.
model:
  model_path: /home/ymj/code/python/EasyMocap/models/smplx
  gender: neutral
  ext: npz
  device: cuda

# 2D detector frontend.
detector:
  type: rtmlib
  solution: wholebody
  mode: balanced
  device: cuda
  backend: onnxruntime

# SMPL-X fitting schedule.
# `loss_weights` is written out explicitly here for readability and easy tuning.
fitting:
  maxiters: 15
  shape_maxiters: 5
  enable_k2d_refine: true
  stages:
    - name: shape
    - name: pose
  loss_weights:
    k2d: 0.0001
    k3d: 1.0
    k3d_hand: 5.0
    k3d_face: 2.0
    reg_poses: 0.001
    reg_poses_zero: 0.01
    reg_hand: 0.0001
    reg_head: 0.01
    reg_expr: 0.01
    reg_shapes: 0.005
    smooth_body: 0.5
    smooth_poses: 0.1
    smooth_Rh: 0.1
    smooth_hand: 0.001
    smooth_head: 0.0
    init_poses: 0.01
    init_shapes: 0.01
    s3d: 1.0
