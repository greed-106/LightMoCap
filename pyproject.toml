[project]
name = "lightmocap"
version = "0.1.0"
description = "LightMocap MVP for EasyMocap refactor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.8.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "torch",
]

[project.optional-dependencies]
detection = [
    "mediapipe>=0.10.0",
    "onnxruntime-gpu>=1.24.0",
    "rtmlib>=0.0.13",
]
viz = [
    "imageio>=2.34.0",
    "imageio[ffmpeg]>=2.34.0",
    "matplotlib>=3.8.0",
    "pyrender>=0.1.45",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "tabulate>=0.9.0",
    "termcolor>=3.0.0",
    "tqdm>=4.67.0",
]

[project.scripts]
lmc = "lightmocap.cli.main:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightmocap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
