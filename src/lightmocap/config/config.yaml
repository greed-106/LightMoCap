defaults:
  - mode: mvsp
  - model: smplx
  - detector: rtmlib
  - fitting: default

# Camera calibration file in the compact single-YAML format.
cameras:
  path: ../CoreView_377/cameras.yaml

# Multiview image root and default output root.
data:
  images: ../CoreView_377
  output: ../outputs/lightmocap

render:
  render_device: gpu
  mesh_color: [245, 245, 245]
  alpha: 1.0
  edge_color: null
  metallic_factor: 0.05
  roughness_factor: 0.65

# Optional frame-range selection for future batched workflows.
frame:
  start: 0
  end: -1
  step: 1
